name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  ANDROID_BASE_CHECKS:
    name: Base Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'
      - name: Perform base checks
        run: ./gradlew app:assembleDebug --stacktrace
  ANDROID_UNIT_TESTS:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'
      - name: Execute unit tests
        run: ./gradlew library:testDebugUnitTest --stacktrace
  ANDROID_BUILD_APK:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # required for telegram notifications on PRs
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'

      - name: Setup custom keystore file
        run: |
          mkdir -p $HOME/.android
          cp ./.ci/debug.keystore $HOME/.android/debug.keystore

      - name: Execute APK build
        run: ./gradlew app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: apk-files
          path: app/build/outputs/apk/**/*.apk

      - name: Notify
        # make sure this step runs, regardless of whether the preceding steps were successful or not
        if: always()
        env:
          # "failure", "success" or "cancelled"
          # see: https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#job-context
          RUN_RESULT: ${{ job.status }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        run: .ci/notify.sh

  # Every master build of the demo app becomes a pre-release, so Obtainium can install and update it
  # (see README). A pre-release does not replace the library release marked as latest.
  PUBLISH:
    name: Publish
    needs: [ANDROID_UNIT_TESTS, ANDROID_BUILD_APK]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk-files
          path: apk

      # All builds are signed with .ci/debug.keystore, so they update each other. Only the 5 newest
      # pre-releases are kept.
      - name: Publish pre-release
        run: |
          tag="build-${{ github.run_number }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$(find apk -name '*.apk')" \
            --prerelease --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug build of the demo app from ${{ github.sha }}, signed with .ci/debug.keystore."
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep '^build-' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Notify
        if: failure()
        env:
          RUN_RESULT: ${{ job.status }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        run: .ci/notify.sh
